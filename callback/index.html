<h1>TikTok authorization</h1>
<p><strong>Code:</strong><br><code id="code">(none)</code></p>
<p><strong>State:</strong><br><code id="state">(none)</code></p>
<p id="err"></p>
<p>Copy the code above and paste it into the local uploader script to finish authorization. The code expires in a few minutes and is used only by the channel owner.</p>
<script>var p=new URLSearchParams(location.search);["code","state"].forEach(function(k){if(p.get(k))document.getElementById(k).textContent=p.get(k)});if(p.get("error"))document.getElementById("err").textContent="Error: "+p.get("error")+" "+(p.get("error_description")||"");</script>
